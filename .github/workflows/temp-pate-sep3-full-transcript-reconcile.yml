name: Temp Pate Sep3 Full Transcript Reconcile
on:
  push:
    paths:
      - '.github/workflows/temp-pate-sep3-full-transcript-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile Josh Pate Sep 3 full transcript
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('data')
          weekly_p=root/'expert-weekly.json'
          intel_p=root/'expert-intelligence.json'
          state_p=root/'expert-episode-state.json'
          weekly=json.loads(weekly_p.read_text())
          intel=json.loads(intel_p.read_text())
          state=json.loads(state_p.read_text())
          episode='Week 1 Upset Alerts + SEC Sues LSU & Viewer’s Guide'
          source_url='https://www.listennotes.com/podcasts/josh-pates-college/week-1-upset-alerts-sec-sues-8VClEAgd6Uu/'
          def add(arr, rec):
              if not any(x.get('id')==rec['id'] for x in arr if isinstance(x,dict)):
                  arr.append(rec)
          add(weekly, {
            'id':'pate-2026-09-03-orst-hou-upset-alert-detail',
            'week':1,'gameId':'2026-W1-ORST-HOU','source':'Josh Pate','episode':episode,'sourceDate':'2026-09-03',
            'segment':'Upset Alerts; full transcript now publicly indexed','type':'dangerous-game / upset alert','explicit':True,
            'direction':'Oregon State at Houston upset-alert concern 5/10; Pate still expects Houston to win and issued no Oregon State ATS/ML wager',
            'summary':'Pate rates Houston upset concern 5/10 at Houston -20.5. He highlights Oregon State transfer QB Braden Atkinson after a 3,600-yard/34-TD true-freshman season at Mercer, notes Atkinson won the starting job over Malik Murphy, and says the opener could be a bigger chore for Houston than expected. He remains bullish on Houston overall, citing veteran QB/OL and an Oregon State receiver transferring to Houston, and does not predict an outright upset.',
            'sourceUrl':source_url
          })
          add(intel, {
            'id':'pate-2026-09-03-orst-hou-upset-alert-detail','week':1,'gameId':'2026-W1-ORST-HOU','episode':episode,
            'sourceFamily':'Josh Pate','analyst':'Josh Pate','sourceDate':'2026-09-03','phase':'pre-Week-1',
            'category':'dangerous-game / quarterback-upside / favorite-start risk','team':'Oregon State / Houston',
            'direction':'Oregon State upset-alert concern 5/10; no ATS/ML wager; Houston still expected to win','conviction':'medium qualitative warning',
            'freshness':'late-indexed full transcript','independence':'distinct-source-family','incrementalInformation':1,
            'modelRelationship':'corroborates-model',
            'summary':'Late full-transcript evidence adds a new mechanism to the existing Oregon State Longshot Lab case: Braden Atkinson arrives after a 3,600-yard/34-TD Mercer season, won the job over Malik Murphy, and gives Oregon State enough quarterback ceiling for Pate to rate Houston upset concern 5/10. Pate remains broadly bullish on Houston and does not make an Oregon State wager, so this is a research upgrade rather than a bet signal.',
            'sourceUrl':source_url
          })
          add(weekly, {
            'id':'pate-2026-09-03-marshall-psu-upset-alert-detail','week':1,'gameId':'2026-W1-MARSH-PSU','source':'Josh Pate','episode':episode,'sourceDate':'2026-09-03',
            'segment':'Upset Alerts; full transcript now publicly indexed','type':'dangerous-game / upset alert','explicit':True,
            'direction':'Marshall at Penn State upset-alert concern 3/10; Pate expects Penn State to be okay and says he kind of likes Penn State to run it up; no ATS wager issued',
            'summary':'Pate rates Penn State upset concern only 3/10 at -24.5. The caution is Marshall QB Carlos Del Rio-Wilson, whom Pate describes as an experienced improviser who can extend plays and create situational frustration, plus memories of Penn State starting slowly against inferior competition last season. Pate does not view the Paterno discussion as a team distraction and leans toward Penn State pulling away.',
            'sourceUrl':source_url
          })
          add(intel, {
            'id':'pate-2026-09-03-marshall-psu-upset-alert-detail','week':1,'gameId':'2026-W1-MARSH-PSU','episode':episode,
            'sourceFamily':'Josh Pate','analyst':'Josh Pate','sourceDate':'2026-09-03','phase':'pre-Week-1',
            'category':'dangerous-game / quarterback-improvisation / favorite-start risk','team':'Marshall / Penn State',
            'direction':'Penn State upset concern only 3/10; no Marshall wager; mild Penn State blowout lean','conviction':'low upset concern',
            'freshness':'late-indexed full transcript','independence':'distinct-source-family','incrementalInformation':1,
            'modelRelationship':'orthogonal-new-information',
            'summary':'Pate adds a low-level Marshall upset mechanism through veteran QB Carlos Del Rio-Wilson’s improvisational and situational ability, while recalling Penn State’s sluggish starts against inferior teams last season. He explicitly keeps concern low at 3/10 and says he kind of likes Penn State to run it up, so this is matchup context rather than underdog support.',
            'sourceUrl':source_url
          })
          found=False
          for rec in state:
              if rec.get('source')=="Josh Pate's College Football Show" and rec.get('episode')==episode:
                  found=True
                  rec['status']='COMPLETE'
                  ce=rec.setdefault('checkedEvidence',[])
                  additions=[
                    'full Listen Notes transcript rechecked and now publicly retrievable end-to-end',
                    'all five upset-alert games and concern-meter values reconciled: Clemson-LSU 7/10, Penn State-Marshall 3/10, Oregon State-Houston 5/10, Toledo-Michigan State 8.5/10, Miami (OH)-Pitt 5/10',
                    'SMU-Florida State exact -2.5 win/cover construction and matchup mechanism reconciled',
                    'Ramen Noodle Express in-episode card reconciled: San Jose State +2.5, Oklahoma State -13.5, Baylor +7.5, Clemson-LSU Under 50.5',
                    'official/near-primary episode page and show notes checked',
                    'official social/pick-sheet evidence checked; Friday Night Lines was separately searched but no reliably attributable additional Sep. 4 card surfaced in public indexing',
                    'all current-week matchups and relevant analyst comments checked',
                    'side/ATS/ML/total/1H constructions and score-prediction availability audited',
                    'material player/unit/scheme/coaching analysis extracted',
                    'Expert Intelligence v1 records created/deduped',
                    'expert-weekly.json cross-check completed',
                    'final completeness audit passed'
                  ]
                  for x in additions:
                      if x not in ce: ce.append(x)
                  rec['lastChecked']='2026-09-05T07:24:00-05:00'
                  rec['ledgerAction']='full-transcript-reconciliation-two-new-matchup-records-and-completeness-upgrade'
                  rec['note']='Full public transcript is now retrievable and closes the remaining upset-alert attribution gaps. New material added for Oregon State-Houston (5/10 concern, QB Braden Atkinson upside, no OSU wager, Houston still expected to win) and Penn State-Marshall (3/10 concern, Carlos Del Rio-Wilson improvisation, mild Penn State blowout lean). Previously captured Clemson-LSU, Toledo-Michigan State, Miami (OH)-Pitt, SMU-FSU and four in-episode Ramen Noodle constructions were verified without duplication. Friday Night Lines was searched as required by the episode; no reliably attributable additional Sep. 4 card surfaced in public indexing, so nothing was inferred. Episode now passes the full completeness checklist and is COMPLETE.'
          if not found:
              raise SystemExit('Target episode state not found')
          weekly_p.write_text(json.dumps(weekly,indent=2,ensure_ascii=False)+'\n')
          intel_p.write_text(json.dumps(intel,indent=2,ensure_ascii=False)+'\n')
          state_p.write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit runtime reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expert-weekly.json data/expert-intelligence.json data/expert-episode-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reconcile Josh Pate Sep 3 full transcript"
            git push
          fi