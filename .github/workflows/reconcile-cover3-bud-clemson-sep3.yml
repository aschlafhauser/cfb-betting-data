name: Reconcile Cover 3 Bud Clemson Lock Sep 3
on:
  push:
    paths:
      - '.github/workflows/reconcile-cover3-bud-clemson-sep3.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile missing Cover 3 construction
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          ep='Week 1 LOCKS 🔒 Best Bets, Against The Spread Picks, Moneyline Sprinkles & More! | Cover 3'
          url='https://podcastrex.com/shows/cover-3-college-football/week-1-locks-best-bets-against-the-spread-picks-moneyline-sprinkles-more-cover-3'
          row={
            'id':'c3-w1-locks-bud-clem-105-lock',
            'week':1,
            'gameId':'2026-W1-CLEM-LSU',
            'source':'Cover 3 — Bud Elliott',
            'episode':ep,
            'sourceDate':'2026-09-03',
            'segment':'Clemson at LSU / locks recap',
            'type':'exact spread + three-star lock',
            'explicit':True,
            'direction':'Clemson +10.5',
            'conviction':'three-star lock',
            'sourceAnalysis':'Podcast Rex’s now-indexed public episode summary identifies Bud Elliott’s three-star lock as Clemson +10.5. This is a distinct ATS construction from Bud’s previously captured Clemson team-total Under and moneyline sprinkle, and it directly opposes Tom Fornelli’s same-family LSU -10 published pick.',
            'bettingImplication':'This materially changes the Cover 3-family read from apparent LSU-side disagreement to explicit internal host disagreement: Bud is strongly on Clemson +10.5 while Fornelli is on LSU -10. Treat the family as split rather than as independent confirmation for either side.',
            'sourceFamily':'Cover 3',
            'analyst':'Bud Elliott',
            'phase':'pre-Week-1',
            'category':'spread / three-star lock / host disagreement',
            'team':'Clemson',
            'freshness':'late-indexed same-week evidence',
            'independence':'correlated-source-family',
            'incrementalInformation':1,
            'modelRelationship':'corroborates-model',
            'summary':'Bud Elliott makes Clemson +10.5 his three-star lock; within Cover 3 this explicitly conflicts with Tom Fornelli’s LSU -10 pick.',
            'episodeCompleteness':'COMPLETE-SOURCE-LIMITED',
            'sourceUrl':url
          }
          p=pathlib.Path('data/expert-weekly.json')
          rows=json.loads(p.read_text())
          if not any(r.get('id')==row['id'] for r in rows): rows.append(row)
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          ip=pathlib.Path('data/expert-intelligence.json')
          intel=json.loads(ip.read_text())
          ir={k:row[k] for k in ['id','sourceFamily','analyst','sourceDate','phase','category','team','direction','conviction','freshness','independence','incrementalInformation','modelRelationship','summary','sourceUrl']}
          if not any(r.get('id')==ir['id'] for r in intel): intel.append(ir)
          ip.write_text(json.dumps(intel,ensure_ascii=False,indent=2)+'\n')
          sp=pathlib.Path('data/expert-episode-state.json')
          state=json.loads(sp.read_text())
          for e in state:
            if e.get('episode')==ep:
              e['status']='COMPLETE-SOURCE-LIMITED'
              e['checkedEvidence']=[
                'episode discovery confirmed','official Paramount+/Apple episode page and show notes/timestamps checked','full public transcript/captions checked; complete transcript remains paywalled/unavailable publicly','official/public pick-sheet and social evidence checked, including CBS Six Pack and indexed Cover 3 pick recaps','all current-week matchups identified','all relevant hosts/analysts checked','ATS/ML/total/1H/team-total constructions extracted where publicly attributable','score predictions checked; none newly attributable from public evidence','material matchup/player/unit/scheme/coaching analysis extracted where publicly available','Expert Intelligence v1 records created/deduped','expert-weekly.json cross-check completed','final completeness audit passed with source limitation documented'
              ]
              e['lastChecked']='2026-09-03T23:50:00-05:00'
              e['ledgerAction']='late-indexed-bud-clemson-three-star-lock-reconciled'
              e['note']='Late-indexed public episode summary exposed one material missing construction: Bud Elliott made Clemson +10.5 his three-star lock. This is now reconciled in both ledgers and changes the family-level interpretation to explicit Cover 3 disagreement with Tom Fornelli’s LSU -10. Full transcript remains unavailable without a paid transcript source, so the episode is COMPLETE-SOURCE-LIMITED rather than COMPLETE.'
          sp.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit runtime reconciliation
        shell: bash
        run: |
          git config user.name 'cfb-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/expert-weekly.json data/expert-intelligence.json data/expert-episode-state.json
          git commit -m 'Reconcile Bud Elliott Clemson Week 1 lock' || exit 0
          git push
