name: Pate Sep 3 Late Transcript Reconciliation
on:
  push:
    paths:
      - '.github/workflows/pate-sep3-late-transcript-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile late Pate upset-alert transcript evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          weekly_path = Path('data/expert-weekly.json')
          intel_path = Path('data/expert-intelligence.json')
          state_path = Path('data/expert-episode-state.json')
          weekly = json.loads(weekly_path.read_text())
          intel = json.loads(intel_path.read_text())
          state = json.loads(state_path.read_text())

          episode = 'Week 1 Upset Alerts + SEC Sues LSU & Viewer’s Guide'
          source_url = 'https://podcasttranscript.ai/library/week-1-upset-alerts-sec-sues-lsu-viewer-s-guide'

          weekly_new = [
            {
              'id': 'pate-w1-clem-lsu-upset-alert-7-late-detail',
              'week': 1,
              'gameId': '2026-W1-CLEM-LSU',
              'source': 'Josh Pate',
              'episode': episode,
              'sourceDate': '2026-09-03',
              'segment': 'Upset Alerts — late-indexed transcript detail',
              'type': 'late transcript upset-alert detail',
              'explicit': True,
              'direction': 'LSU favorite caution / Clemson upset path; 7/10 concern meter',
              'conviction': '7/10 upset-alert concern; not a standalone Clemson ATS or ML wager',
              'sourceAnalysis': "Pate explicitly puts LSU at 7/10 on his upset-alert concern meter while still picking LSU to win. He says he does not fully buy that LSU has blocked out the off-field distraction, emphasizes Week 1 variance and Clemson's pressure/urgency, notes Clemson players strongly rally around their new quarterback, and sketches a path where LSU's young offensive front and passing game are shaky early or turn the ball over while Clemson extends drives through quick throws or manufactured rushing yards.",
              'bettingImplication': "This independently corroborates the Longshot Upset Lab's Clemson favorite-volatility/upset mechanism and strengthens the qualitative Clemson upset case. It must not be converted into an inferred Clemson spread or moneyline bet: Pate still picks LSU to win, and his explicit Under/side views are separate constructions already captured from the Pate family.",
              'sourceUrl': source_url
            },
            {
              'id': 'pate-w1-miaoh-pitt-upset-alert-5-late-detail',
              'week': 1,
              'gameId': '2026-W1-MIAOH-PITT',
              'source': 'Josh Pate',
              'episode': episode,
              'sourceDate': '2026-09-03',
              'segment': 'Upset Alerts — late-indexed transcript detail',
              'type': 'late transcript upset-alert detail',
              'explicit': True,
              'direction': 'Pitt favorite caution / Miami (OH) upset path; 5/10 concern meter',
              'conviction': '5/10 upset-alert concern; not a standalone Miami (OH) ATS or ML wager',
              'sourceAnalysis': "Pate puts Pitt at 5/10 on his upset-alert concern meter. He likes Pitt's quarterback situation but identifies enough uncertainty around the favorite to be mildly concerned, notes Miami (OH) is priced among the MAC's better teams, and says Miami's offensive line can help slow the game and reduce Pitt's possession count, creating a plausible path to keep the game tight.",
              'bettingImplication': 'This upgrades the previously generic Miami (OH)-Pitt upset warning into a quantified, mechanism-specific favorite-risk signal. No ATS side, moneyline price, or wager is inferred.',
              'sourceUrl': source_url
            }
          ]
          intel_new = [
            {
              'id': 'pate-2026-09-03-clem-lsu-upset-alert-7-late-detail',
              'week': 1,
              'gameId': '2026-W1-CLEM-LSU',
              'episode': episode,
              'episodeCompleteness': 'COMPLETE-SOURCE-LIMITED',
              'sourceFamily': 'Josh Pate',
              'analyst': 'Josh Pate',
              'sourceDate': '2026-09-03',
              'phase': 'pre-Week-1',
              'category': 'upset-alert',
              'team': 'Clemson',
              'direction': 'positive underdog / LSU favorite caution',
              'conviction': '7/10 upset-alert concern; LSU still picked to win',
              'freshness': 'late pre-kickoff transcript evidence',
              'independence': 'distinct source family; correlated with other Josh Pate episode items',
              'incrementalInformation': 'positive — exact 7/10 concern rating plus distraction, quarterback buy-in, early LSU passing/turnover and drive-extension mechanisms were not represented in the earlier generic alert',
              'modelRelationship': 'corroborates-model',
              'summary': "Pate rates LSU's upset risk 7/10 while still picking LSU to win. He questions whether LSU can fully wall off the off-field distraction, highlights Week 1 volatility and Clemson's team buy-in around its new QB, and gives Clemson a credible path through early LSU passing/turnover shakiness plus quick-game or rushing-based drive extension. This corroborates the Longshot Upset Lab mechanism without creating an inferred Clemson wager.",
              'sourceUrl': source_url
            },
            {
              'id': 'pate-2026-09-03-miaoh-pitt-upset-alert-5-late-detail',
              'week': 1,
              'gameId': '2026-W1-MIAOH-PITT',
              'episode': episode,
              'episodeCompleteness': 'COMPLETE-SOURCE-LIMITED',
              'sourceFamily': 'Josh Pate',
              'analyst': 'Josh Pate',
              'sourceDate': '2026-09-03',
              'phase': 'pre-Week-1',
              'category': 'upset-alert',
              'team': 'Miami (OH)',
              'direction': 'positive underdog / Pitt favorite caution',
              'conviction': '5/10 upset-alert concern',
              'freshness': 'late pre-kickoff transcript evidence',
              'independence': 'distinct source family; correlated with other Josh Pate episode items',
              'incrementalInformation': 'positive — exact 5/10 concern rating and slow-game/possession-compression mechanism were not represented in the earlier generic alert',
              'modelRelationship': 'orthogonal-new-information',
              'summary': "Pate rates Pitt's upset risk 5/10 and says Miami (OH)'s offensive line can help slow the game and compress possessions, giving the MAC contender a plausible path to keep Pitt uncomfortable. This is a quantified qualitative warning only; no ATS or moneyline construction is inferred.",
              'sourceUrl': source_url
            }
          ]

          existing_weekly = {r.get('id') for r in weekly}
          existing_intel = {r.get('id') for r in intel}
          added_w = 0
          added_i = 0
          for r in weekly_new:
            if r['id'] not in existing_weekly:
              weekly.append(r); added_w += 1
          for r in intel_new:
            if r['id'] not in existing_intel:
              intel.append(r); added_i += 1

          for s in state:
            if s.get('source') == "Josh Pate's College Football Show" and s.get('episode') == episode:
              ev = s.setdefault('checkedEvidence', [])
              for item in [
                'late-indexed full transcript/search evidence rechecked September 5',
                'exact upset-alert concern-meter values and mechanisms re-audited',
                'late detail deduped against prior generic upset-alert rows',
                'Expert Intelligence v1 and expert-weekly.json cross-check completed after late transcript evidence'
              ]:
                if item not in ev: ev.append(item)
              s['lastChecked'] = '2026-09-05T01:05:36-05:00'
              s['ledgerAction'] = 'late-transcript-concern-meter-details-appended-and-deduped'
              s['note'] = "Late-indexed transcript evidence resolves two previously source-limited concern-meter details without changing the episode's source-limited status: LSU is 7/10 on Pate's upset-alert concern meter (with distraction, Week 1 variance, Clemson QB/team buy-in and LSU early passing/turnover mechanisms) and Pitt is 5/10 (with a Miami (OH) slow-game/possession-compression path). Earlier Ramen Noodle constructions remain same-family duplicates. No ATS/ML wager was inferred from either upset alert. Remaining unmatched concern-meter detail from the full segment is still source-limited, so the episode remains COMPLETE-SOURCE-LIMITED."
              break

          weekly_path.write_text(json.dumps(weekly, indent=2) + '\n')
          intel_path.write_text(json.dumps(intel, indent=2) + '\n')
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          print(f'added weekly={added_w}, intelligence={added_i}')
      - name: Commit runtime reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expert-weekly.json data/expert-intelligence.json data/expert-episode-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reconcile late Josh Pate upset-alert transcript detail"
            git push
          fi
