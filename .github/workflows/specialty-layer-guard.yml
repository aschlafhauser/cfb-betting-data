name: CFB specialty layer guard
# price-sanity revision: 2026-10-26.2

on:
  # The full runtime handles all push events. Two pending workflows sharing
  # one writer lock cancel each other even with cancel-in-progress false.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize with the full governed-runtime workflow so neither job can move
  # main underneath the other's generated-data commit/rebase sequence.
  group: cfb-governed-runtime-writer
  cancel-in-progress: false

jobs:
  specialty:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The run may wait behind the full governed writer. Bind to the latest
          # serialized main only after the shared lock is acquired, not to the
          # event's stale head SHA, so generated-data commits never need to
          # rebase across a completed full-runtime publication.
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install specialty runtime dependencies
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Refresh selected-week statistics
        run: |
          node scripts/refresh-team-metrics.mjs
          node scripts/refresh-espn-fpi.mjs

      - name: Build and verify selected-week specialty layers
        id: specialty_guard
        continue-on-error: true
        run: node scripts/specialty-layer-guard.mjs

      - name: Persist specialty runtime and diagnostics
        if: always()
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'
          git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then echo 'No specialty-layer changes.'; exit 0; fi
          git commit -m 'chore: refresh CFB specialty layers [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Enforce specialty hard gate
        if: always()
        run: |
          test "${{ steps.specialty_guard.outcome }}" = "success" || { echo 'Specialty-layer hard gate failed; diagnostics were persisted for repair.'; exit 1; }
