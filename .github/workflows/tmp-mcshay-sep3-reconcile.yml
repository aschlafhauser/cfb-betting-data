name: Temporary McShay Sep 3 Reconciliation
on:
  push:
    paths:
      - 'data/mcshay-reconcile-trigger.txt'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile McShay episode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          weekly_p=Path('data/expert-weekly.json')
          intel_p=Path('data/expert-intelligence.json')
          state_p=Path('data/expert-episode-state.json')
          weekly=json.loads(weekly_p.read_text())
          intel=json.loads(intel_p.read_text())
          state=json.loads(state_p.read_text())

          episode="The SEC Sues LSU: Making Sense of the Chaos With Bruce Feldman"
          source_url="https://www.theringer.com/podcasts/the-todd-mcshay-show/2026/09/03/the-sec-sues-lsu-making-sense-of-the-chaos-with-bruce-feldman"

          weekly_rows=[
            {
              "id":"mcshay-2026-09-03-lsu-clemson-distraction",
              "week":1,
              "gameId":"2026-W1-CLEM-LSU",
              "matchup":"Clemson at LSU",
              "source":"The McShay Show",
              "sourceFamily":"The McShay Show",
              "analyst":"Bruce Feldman / Todd McShay",
              "sourceDate":"2026-09-03",
              "episode":episode,
              "category":"availability / coaching / situational",
              "team":"LSU",
              "direction":"negative LSU situational context; no wager",
              "conviction":"Feldman and McShay explicitly question how the legal fight can avoid being a distraction less than 48 hours before kickoff",
              "sourceAnalysis":"Feldman says the LSU/SEC legal fight has reached an extraordinary level less than 48 hours before LSU opens against Clemson and explicitly questions how it can avoid being a distraction for Lane Kiffin and the program. McShay agrees with the distraction concern. No ATS, ML, total, score prediction, or bet is issued in this segment.",
              "bettingImplication":"Independent McShay-family qualitative downside to LSU's preparation/focus before Clemson. Preserve as situational counterweight only; do not convert it into an inferred Clemson wager or additional model points.",
              "modelRelationship":"orthogonal-new-information",
              "episodeCompleteness":"COMPLETE",
              "sourceUrl":source_url
            },
            {
              "id":"mcshay-2026-09-03-kent-sc-stewart",
              "week":1,
              "gameId":"2026-W1-KENT-SC",
              "matchup":"Kent State at South Carolina",
              "source":"The McShay Show",
              "sourceFamily":"The McShay Show",
              "analyst":"Bruce Feldman",
              "sourceDate":"2026-09-03",
              "episode":episode,
              "category":"availability / defensive personnel",
              "team":"South Carolina",
              "direction":"negative South Carolina defensive availability context; no wager",
              "conviction":"Feldman says Dylan Stewart probably will not play this weekend",
              "sourceAnalysis":"While discussing South Carolina's elite athletes, Feldman says edge defender Dylan Stewart is probably not going to play this weekend and that the program hopes to have him ready when the bigger games begin. No spread, total, ML, score prediction, or wager is attached.",
              "bettingImplication":"Material personnel downgrade for South Carolina-Kent State, but not a standalone betting recommendation. Treat as availability information and avoid inventing a numeric model adjustment without the normal injury-value process.",
              "modelRelationship":"orthogonal-new-information",
              "episodeCompleteness":"COMPLETE",
              "sourceUrl":source_url
            }
          ]

          intel_rows=[
            {
              "id":"mcshay-2026-09-03-lsu-clemson-distraction",
              "week":1,
              "gameId":"2026-W1-CLEM-LSU",
              "episode":episode,
              "sourceFamily":"The McShay Show",
              "analyst":"Bruce Feldman / Todd McShay",
              "sourceDate":"2026-09-03",
              "phase":"pre-kickoff",
              "category":"situational/coaching",
              "team":"LSU",
              "direction":"negative",
              "conviction":"medium",
              "freshness":"high",
              "independence":"independent source family; McShay/Feldman same-episode discussion treated as correlated",
              "incrementalInformation":"yes - explicit less-than-48-hours distraction mechanism from the legal dispute; no inferred wager",
              "modelRelationship":"orthogonal-new-information",
              "summary":"Feldman and McShay explicitly question how LSU's escalating SEC/legal fight can avoid being a distraction less than 48 hours before Clemson. This is situational downside to LSU preparation/focus, not an ATS/ML/total recommendation.",
              "sourceUrl":source_url
            },
            {
              "id":"mcshay-2026-09-03-kent-sc-stewart",
              "week":1,
              "gameId":"2026-W1-KENT-SC",
              "episode":episode,
              "sourceFamily":"The McShay Show",
              "analyst":"Bruce Feldman",
              "sourceDate":"2026-09-03",
              "phase":"pre-kickoff",
              "category":"availability",
              "team":"South Carolina",
              "direction":"negative",
              "conviction":"medium-high",
              "freshness":"high",
              "independence":"independent source family",
              "incrementalInformation":"yes - newly attributable likely Week 1 absence for Dylan Stewart",
              "modelRelationship":"orthogonal-new-information",
              "summary":"Feldman says South Carolina edge Dylan Stewart probably will not play this weekend. Preserve as a Week 1 availability downgrade for Kent State-South Carolina; no unspoken spread, total, ML or numeric injury value is inferred.",
              "sourceUrl":source_url
            }
          ]

          def add_unique(rows, new_rows):
            ids={r.get('id') for r in rows}
            added=0
            for r in new_rows:
              if r['id'] not in ids:
                rows.append(r); ids.add(r['id']); added+=1
            return added

          aw=add_unique(weekly, weekly_rows)
          ai=add_unique(intel, intel_rows)

          existing=next((r for r in state if r.get('source')=='The McShay Show' and r.get('episode')==episode), None)
          record={
            "source":"The McShay Show",
            "episode":episode,
            "sourceDate":"2026-09-03",
            "status":"COMPLETE",
            "checkedEvidence":[
              "episode discovery verified on official Ringer and Apple Podcasts listings",
              "official Ringer episode page/show notes and timestamps checked",
              "full public transcript checked via Podscripts/Podscan indexing",
              "official social/pick-sheet evidence checked; no episode-specific betting pick sheet surfaced",
              "all current-week matchup-relevant segments identified",
              "Todd McShay, Steve Muench and Bruce Feldman attributable current-week observations checked; same-episode analysts treated as correlated",
              "side/ATS/ML/total/1H constructions checked; none issued in this episode",
              "score predictions checked; none issued for the extracted current-week items",
              "material matchup/player/unit/scheme/coaching/availability analysis extracted",
              "Expert Intelligence v1 records created/deduped",
              "expert-weekly.json cross-check completed",
              "final completeness audit passed"
            ],
            "lastChecked":"2026-09-04T17:36:42-05:00",
            "ledgerAction":"two-new-pre-kickoff-material-records-appended-and-deduped",
            "note":"Full transcript review found two materially useful Week 1 items before kickoff: Feldman/McShay explicitly flag LSU's escalating SEC/legal dispute as a potential distraction less than 48 hours before Clemson, and Feldman says South Carolina edge Dylan Stewart probably will not play this weekend vs Kent State. Neither item includes an ATS/ML/total wager or score prediction, so none is inferred. Broader Oklahoma/Rutgers/South Carolina season scouting was not promoted into matchup rows unless directly current-week material."
          }
          if existing:
            existing.update(record)
          else:
            state.append(record)

          weekly_p.write_text(json.dumps(weekly, indent=2, ensure_ascii=False)+'\n')
          intel_p.write_text(json.dumps(intel, indent=2, ensure_ascii=False)+'\n')
          state_p.write_text(json.dumps(state, indent=2, ensure_ascii=False)+'\n')
          print({'weekly_added':aw,'intel_added':ai,'state_total':len(state)})
          PY
      - name: Commit runtime reconciliation
        run: |
          git config user.name 'cfb-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/expert-weekly.json data/expert-intelligence.json data/expert-episode-state.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Reconcile McShay Sep 3 Week 1 intelligence'
            git push
          fi
