name: Fix Locker Room completeness state
on:
  push:
    paths:
      - '.github/workflows/fix-locker-state-sep3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix state
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/expert-episode-state.json')
          state=json.loads(p.read_text())
          changed=False
          for e in state:
            if 'Josh Pate Is ALL IN On DJ Lagway & Baylor' in e.get('episode',''):
              e['status']='COMPLETE'
              e['checkedEvidence']=["official Omny episode page/show notes and timestamp chapters","full indexed Listen Notes transcript","host-level confidence-unit picks","moneyline/spread/parlay constructions","current-week matchup relevance and dedupe check","Expert Intelligence v1 append","expert-weekly.json cross-check","final completeness audit"]
              e['lastChecked']='2026-09-03T08:42:00-05:00'
              e['ledgerAction']='late-transcript-reconciled-material-confidence-and-construction-updates'
              e['note']='Full transcript reconciled. Runtime rows verified in expert-weekly.json and expert-intelligence.json, including Josh Pate Notre Dame -20.5 (3 units), Ole Miss -6.5 (3), Baylor +7.5 (5), UCLA -1.5 (1), San Jose State moneyline, Liberty +6.5 strictly as a parlay leg, and Will Compton Cal moneyline (3 units). Episode is COMPLETE.'
              changed=True
          if not changed:
            raise SystemExit('Locker Room episode state not found')
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "cfb-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/expert-episode-state.json
          git commit -m "Fix Locker Room completeness state"
          git push
