name: Reconcile McShay SEC LSU Sep 3
on:
  push:
    paths:
      - '.github/workflows/reconcile-mcshay-sec-lsu-sep3.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append episode completeness state
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/expert-episode-state.json')
          rows=json.loads(p.read_text())
          ep="The SEC Sues LSU: Making Sense of the Chaos With Bruce Feldman"
          if not any(r.get('episode')==ep for r in rows):
            rows.append({
              "source":"The McShay Show",
              "episode":ep,
              "sourceDate":"2026-09-03",
              "status":"COMPLETE-SOURCE-LIMITED",
              "checkedEvidence":[
                "episode discovery in official Ringer feed",
                "official Ringer episode page/show notes and timestamp chapters",
                "transcript/captions searched; full transcript not publicly retrievable in this pass",
                "official social/pick-sheet evidence checked; no episode pick sheet or matchup-specific social picks surfaced",
                "all current-week matchup relevance identified: LSU-Clemson roster/eligibility context only",
                "all relevant analysts checked: Todd McShay, Steve Muench, Bruce Feldman",
                "side/ATS/ML/total/1H constructions checked; none attributable from available evidence",
                "score predictions checked; none attributable from available evidence",
                "material player/unit/scheme/coaching analysis checked; LSU eligibility dispute concerns Dae'Quan Wright and Zxavian Harris",
                "Expert Intelligence v1 dedupe completed; eligibility issue already captured in weekday market/news intelligence, so zero incremental-information credit",
                "expert-weekly.json cross-check completed; no new row warranted",
                "final completeness audit passed using all reasonably available public evidence"
              ],
              "lastChecked":"2026-09-03T18:55:00-05:00",
              "ledgerAction":"none-zero-incremental-already-captured",
              "note":"New McShay/Feldman episode reviewed. The only current-week portal-relevant mechanism is LSU-Clemson eligibility/roster uncertainty around former NFL players Dae'Quan Wright and Zxavian Harris. That risk is already explicitly represented in weekday-intel as an LSU eligibility-litigation information-risk flag, so it receives zero incremental-information credit and no duplicate expert-weekly or Expert Intelligence row is added. Available evidence exposes no attributable side, total, price, wager or score prediction. Full transcript remains unavailable, but all public evidence was exhausted; COMPLETE-SOURCE-LIMITED."
            })
            p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Commit completeness state
        shell: bash
        run: |
          git config user.name "cfb-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/expert-episode-state.json
          git commit -m "Record McShay SEC-LSU episode completeness" || exit 0
          git push
