name: Reconcile Solid Verbal Week 1 Sep 3
on:
  push:
    paths:
      - '.github/workflows/reconcile-solid-verbal-week1-sep3.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record new Solid Verbal episode completeness state
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/expert-episode-state.json')
          state=json.loads(p.read_text())
          ep='College Football Week 1: Picks, Sneaky Games & Parachuting into 2026'
          if not any(e.get('source')=='Solid Verbal' and e.get('episode')==ep for e in state):
            state.append({
              'source':'Solid Verbal',
              'episode':ep,
              'sourceDate':'2026-09-03',
              'status':'PROVISIONAL',
              'checkedEvidence':[
                'official Omny episode page and description',
                'official chapter timestamps for all primary Week 1 matchups',
                'Omny transcript availability indicator',
                'web-indexed transcript/search evidence',
                'searches for host-attributable picks, locks, upset picks and score/price constructions',
                'current expert-weekly.json dedupe check'
              ],
              'lastChecked':'2026-09-03T11:54:55-05:00',
              'ledgerAction':'none-yet-awaiting-retrievable-attributable-transcript',
              'note':'New full Week 1 preview/picks episode discovered. Official chapters cover Clemson-LSU, Baylor-Auburn, Boise State-Oregon, UCLA-Cal, Louisville-Ole Miss, Wisconsin-Notre Dame, SMU-Florida State, Colorado-Georgia Tech, Fresno State-USC, Miami-Stanford, under-the-radar games, Window of Opportunity, locks/upset picks and recap. Omny indicates a transcript exists, but the transcript text and host-attributable exact picks/prices were not retrievable through available indexed evidence in this pass. No speculative expert-weekly or Expert Intelligence rows were created. Episode remains PROVISIONAL for silent recheck.'
            })
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit runtime state
        shell: bash
        run: |
          git config user.name 'cfb-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/expert-episode-state.json
          git commit -m 'Track new Solid Verbal Week 1 picks episode' || exit 0
          git push
