name: Capture governed CFB runtime
# checkpoint revision: 2026-10-29 Thursday verification-order checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/expert-weekly.json'
      - 'data/injuries.json'
      - 'data/expert-episode-audit/**'
      - 'data/phil-inseason-*-2026.json'
      - '.github/workflows/capture-governed-runtime.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Every governed CFB writer shares one lock.  The specialty workflow was
  # previously able to push while this job was publishing model inputs, which
  # caused rebase failures and consumed the 30-minute budget before the sticky
  # verification gates could run.
  group: cfb-governed-runtime-writer
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-24.04
    # Browser installation plus the full desktop/mobile verification matrix can
    # legitimately exceed 30 minutes.  A timeout before the gate steps leaves no
    # selected-week manifest and must never masquerade as a completed checkpoint.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance selected week only when prior slate is complete
        run: node scripts/rollover-selected-week.mjs

      - name: Persist selected-week rollover before model refresh
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/weekly-board.json; then echo 'No rollover persistence needed.'; exit 0; fi
          git add data/weekly-board.json
          git commit -m 'chore: persist selected-week CFB rollover [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main || { git rebase --abort || true; echo 'Could not safely reconcile rollover with latest main.'; exit 1; }
          git push origin HEAD:main

      - name: Read selected-week control metadata
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8')),rows=b.games||[],now=Date.now(),unstarted=rows.filter(g=>{const t=Date.parse(g.dateTime||g.kickoff||'');return !Number.isFinite(t)||t>now}),due=unstarted.filter(g=>{const t=Date.parse(g.dateTime||g.kickoff||'');return !Number.isFinite(t)||t-now<=72*3600000}),dueSourceLimited=due.filter(g=>/SOURCE-LIMITED/i.test(String(g.deepDiveStatus||g.stage||''))&&g.currentSpread==null&&g.currentTotal==null).length;const season=Number(b.season||2026),week=Number(b.week),games=Number(b.scheduleCoverage?.slateCount||rows.length||0),dueRequired=Math.max(0,due.length-dueSourceLimited);if(!Number.isFinite(week)||week<0)throw new Error('weekly-board.json has no valid selected week');if(!Number.isFinite(games)||games<=0)throw new Error('weekly-board.json has no valid selected-week game count');console.log(`CFB_SEASON=${season}`);console.log(`CFB_WEEK=${week}`);console.log(`CFB_EXPECTED_GAMES=${games}`);console.log(`CFB_MIN_MARKET_GAMES=${Math.max(1,dueRequired)}`);console.log(`CFB_SOURCE_LIMITED_MARKET_EXEMPTIONS=${dueSourceLimited}`);
          NODE

      - name: Losslessly reconcile Expert Intelligence primary ledger
        id: expert_sync
        continue-on-error: true
        run: node scripts/sync-expert-ledger.mjs

      - name: Verify team-metric parser regression cases
        run: |
          node scripts/test-team-metrics.mjs
          node scripts/test-market-fields.mjs

      - name: Refresh team and position-group statistical display metrics
        id: stats_refresh
        continue-on-error: true
        run: |
          if timeout 300 node scripts/refresh-team-metrics.mjs; then exit 0; fi
          echo 'Live team-metric refresh timed out; validating the already-persisted selected-week checkpoint.'
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));const m=JSON.parse(fs.readFileSync('data/team-metrics-current.json','utf8'));const age=Date.now()-Date.parse(m.updatedAt||'');if(Number(m.week)!==Number(b.week)||!Number.isFinite(age)||age<0||age>6*3600000||Number((m.teams||[]).length)<100)throw new Error('Persisted team-metric checkpoint is not current, selected-week, or sufficiently covered.');console.log(`Using current persisted team-metric checkpoint: week ${m.week}, ${m.teams.length} teams, age ${Math.round(age/60000)}m.`);
          NODE

      - name: Refresh ESPN FPI and opponent-adjusted efficiency components
        id: fpi_refresh
        continue-on-error: true
        run: |
          if timeout 300 node scripts/refresh-espn-fpi.mjs; then exit 0; fi
          echo 'Live ESPN FPI refresh timed out; validating the already-persisted selected-week checkpoint.'
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));const f=JSON.parse(fs.readFileSync('data/espn-fpi-current.json','utf8'));const age=Date.now()-Date.parse(f.updatedAt||'');if(Number(f.week)!==Number(b.week)||!Number.isFinite(age)||age<0||age>6*3600000||Number(f.coverage?.rows||0)<100||Number(f.coverage?.namedRows||0)<100)throw new Error('Persisted FPI checkpoint is not current, selected-week, or sufficiently covered.');console.log(`Using current persisted FPI checkpoint: week ${f.week}, ${f.coverage.rows} rows, age ${Math.round(age/60000)}m.`);
          NODE

      - name: Refresh newest governed Phil Steele in-season tables
        id: phil_refresh
        continue-on-error: true
        run: node scripts/refresh-phil-inseason.mjs

      - name: Publish selected-week checkpoint before browser calculation
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/; then echo 'No checkpoint persistence needed.'; exit 0; fi
          # Commit every generated data change together. Leaving expert/market files
          # unstaged and reapplying them with --autostash can inject conflict markers
          # into JSON that later verification steps read as governed input.
          git add data/
          if git diff --cached --quiet; then echo 'No publishable checkpoint changes.'; exit 0; fi
          git commit -m 'chore: publish selected-week CFB checkpoint [skip ci]'
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; echo 'Could not safely reconcile checkpoint with latest main.'; exit 1; }
          git push origin HEAD:main

      - name: Install browser runtime
        if: ${{ always() }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          if ! timeout 180 npx playwright install --with-deps chromium && ! timeout 180 npx playwright install chromium; then
            echo 'Playwright downloads unavailable; binding the hosted runner browser to the pinned executable path.'
            target="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
            chrome="$(command -v google-chrome || command -v chromium || true)"
            test -n "$chrome"
            mkdir -p "$(dirname "$target")"
            ln -sf "$chrome" "$target"
          fi

      - name: Capture governed portal outputs using current selected-week inputs
        id: capture_runtime
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "Governed capture attempt ${attempt}/4"
            if node scripts/capture-governed-runtime.mjs; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 30; fi
          done
          exit 1

      - name: Reconcile canonical team identities across schedule, ESPN and Phil Steele
        id: identity
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/audit-team-identities.mjs

      - name: Verify Phil Steele in-season quantitative model and display layer
        id: phil_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-phil-inseason-layer.mjs

      - name: Verify selectable multi-model and market-independent fair construction
        id: multimodel_verify
        if: ${{ always() }}
        continue-on-error: true
        # Three full browser attempts include statistical and market-integrity
        # sub-verifiers; five minutes can terminate a healthy retry matrix.
        timeout-minutes: 15
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Multi-model verification attempt ${attempt}/3"
            if node scripts/verify-multi-model.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Build full-slate evidence-backed Deep Dives
        id: deep_dives
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/build-deep-dive-runtime.mjs

      - name: Build isolated unified upset research
        id: upset
        if: ${{ always() }}
        continue-on-error: true
        run: |
          node scripts/build-upset-research.mjs
          node scripts/verify-upset-inputs.mjs

      - name: Refresh Market Movers and specialty screens
        id: specialty
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/build-specialty-layers.mjs

      - name: Refresh free-source moneylines
        id: moneylines
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/refresh-free-moneylines.mjs

      - name: Apply governed free-source moneylines
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/apply-free-moneylines.mjs

      - name: Apply Longshot v2 25-point scores and narratives
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/apply-longshot-v2.mjs

      - name: Freeze due immutable pre-kickoff snapshots
        if: ${{ always() }}
        continue-on-error: true
        env:
          # A six-hour prospective window survives several delayed/failed hourly
          # runs while remaining close enough to kickoff to preserve decision state.
          CFB_SNAPSHOT_LOOKAHEAD_MINUTES: '360'
        run: node scripts/freeze-pre-kickoff-snapshots.mjs

      - name: Audit immutable pre-kickoff snapshot integrity
        id: snapshot_verify
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/verify-final-snapshot-integrity.mjs

      - name: Verify statistical/FPI Matchup Center display at desktop and mobile
        id: stats_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-statistical-display.mjs

      - name: Verify independent market-derived arithmetic and selected-model render
        id: market_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-market-derived-integrity.mjs

      - name: Refresh weekly control manifest
        id: manifest
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/refresh-weekly-manifest.mjs

      - name: Persist governed decision runtime safely
        if: ${{ always() }}
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/; then echo 'No governed data changes.'; exit 0; fi
          git add data/
          git commit -m 'chore: persist governed CFB decision runtime [skip ci]'
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; echo 'Could not safely reconcile generated runtime with latest main.'; exit 1; }
          git push origin HEAD:main

      - name: Verify live production decision system
        id: live_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
          CFB_MIN_MEANINGFUL_MODELS: '40'
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            echo "Live production verification attempt ${attempt}/6"
            if node scripts/verify-live-portal.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify every live portal tab and specialty field
        id: completeness_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            echo "Portal completeness verification attempt ${attempt}/6"
            if node scripts/verify-portal-completeness.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          exit 1

      - name: Verify Best Bets render stability and model-independent specialty layers
        id: stability_verify
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Model/specialty stability verification attempt ${attempt}/3"
            if node scripts/verify-model-specialty-stability.mjs; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Certify clean live-browser verification
        if: ${{ always() }}
        env:
          CAPTURE_OUTCOME: ${{ steps.capture_runtime.outcome }}
          PHIL_REFRESH_OUTCOME: ${{ steps.phil_refresh.outcome }}
          PHIL_OUTCOME: ${{ steps.phil_verify.outcome }}
          MULTIMODEL_OUTCOME: ${{ steps.multimodel_verify.outcome }}
          STATS_OUTCOME: ${{ steps.stats_verify.outcome }}
          MARKET_OUTCOME: ${{ steps.market_verify.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          COMPLETENESS_OUTCOME: ${{ steps.completeness_verify.outcome }}
          STABILITY_OUTCOME: ${{ steps.stability_verify.outcome }}
        run: |
          failed_outcomes=""
          for outcome in "$CAPTURE_OUTCOME" "$PHIL_REFRESH_OUTCOME" "$PHIL_OUTCOME" "$MULTIMODEL_OUTCOME" "$STATS_OUTCOME" "$MARKET_OUTCOME" "$LIVE_OUTCOME" "$COMPLETENESS_OUTCOME" "$STABILITY_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "Live certification prerequisite did not succeed: $outcome"
              failed_outcomes="${failed_outcomes} ${outcome}"
            fi
          done
          if [ -n "$failed_outcomes" ]; then
            LIVE_CERT_FAILURES="$failed_outcomes" node - <<'NODE'
          const fs=require('fs');const p=`data/weekly-manifest-${process.env.CFB_SEASON}-w${process.env.CFB_WEEK}.json`;const m=JSON.parse(fs.readFileSync(p,'utf8'));m.gates.productionVerifier={status:'FAIL',priorFailure:true,verifiedAt:new Date().toISOString(),detail:`Explicit live-browser certification failed and remains sticky until every dedicated verifier passes. Outcomes:${process.env.LIVE_CERT_FAILURES||' unknown'}.`};m.status='FAIL';m.updatedAt=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          else
            node - <<'NODE'
          const fs=require('fs');const p=`data/weekly-manifest-${process.env.CFB_SEASON}-w${process.env.CFB_WEEK}.json`;const m=JSON.parse(fs.readFileSync(p,'utf8'));m.gates.productionVerifier={status:'PASS',priorFailure:false,verifiedAt:new Date().toISOString(),detail:'Explicit selected-week live decision-system, identity, Phil, FPI/statistical, multi-model independence, market-derived, every-tab and mobile/stability verification passed.'};m.failures=(m.failures||[]).filter(x=>String(x)!=='productionVerifier');m.currentPriorityQueue=(m.currentPriorityQueue||[]).filter(x=>!String(x).startsWith('productionVerifier:'));const hardFail=Object.values(m.gates||{}).some(g=>g?.status==='FAIL');m.status=hardFail?'FAIL':'PASS-WITH-IN-PROGRESS-GATES';m.updatedAt=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          fi
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'; git add data/weekly-manifest-${CFB_SEASON}-w${CFB_WEEK}.json
          if ! git diff --cached --quiet; then git commit -m 'chore: certify clean CFB live verification [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi

      - name: Enforce weekly non-negotiable gates
        if: ${{ always() }}
        env:
          CAPTURE_OUTCOME: ${{ steps.capture_runtime.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PHIL_REFRESH_OUTCOME: ${{ steps.phil_refresh.outcome }}
          PHIL_OUTCOME: ${{ steps.phil_verify.outcome }}
          MULTIMODEL_OUTCOME: ${{ steps.multimodel_verify.outcome }}
          DEEP_DIVE_OUTCOME: ${{ steps.deep_dives.outcome }}
          UPSET_OUTCOME: ${{ steps.upset.outcome }}
          SPECIALTY_OUTCOME: ${{ steps.specialty.outcome }}
          STATS_OUTCOME: ${{ steps.stats_verify.outcome }}
          MARKET_OUTCOME: ${{ steps.market_verify.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          LIVE_OUTCOME: ${{ steps.live_verify.outcome }}
          COMPLETENESS_OUTCOME: ${{ steps.completeness_verify.outcome }}
          STABILITY_OUTCOME: ${{ steps.stability_verify.outcome }}
        run: |
          node scripts/verify-weekly-gates.mjs
          for outcome in "$CAPTURE_OUTCOME" "$IDENTITY_OUTCOME" "$PHIL_REFRESH_OUTCOME" "$PHIL_OUTCOME" "$MULTIMODEL_OUTCOME" "$DEEP_DIVE_OUTCOME" "$UPSET_OUTCOME" "$SPECIALTY_OUTCOME" "$STATS_OUTCOME" "$MARKET_OUTCOME" "$MANIFEST_OUTCOME" "$LIVE_OUTCOME" "$COMPLETENESS_OUTCOME" "$STABILITY_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              echo "Sticky governed-runtime step did not succeed: $outcome"
              exit 1
            fi
          done
