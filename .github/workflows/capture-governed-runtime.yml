name: Capture governed CFB runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/capture-governed-runtime.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Every governed CFB writer shares one lock.  The specialty workflow was
  # previously able to push while this job was publishing model inputs, which
  # caused rebase failures and consumed the 30-minute budget before the sticky
  # verification gates could run.
  group: cfb-governed-runtime-writer
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    # Browser installation plus the full desktop/mobile verification matrix can
    # legitimately exceed 30 minutes.  A timeout before the gate steps leaves no
    # selected-week manifest and must never masquerade as a completed checkpoint.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance selected week only when prior slate is complete
        run: node scripts/rollover-selected-week.mjs

      - name: Persist selected-week rollover before model refresh
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/weekly-board.json; then echo 'No rollover persistence needed.'; exit 0; fi
          git add data/weekly-board.json
          git commit -m 'chore: persist selected-week CFB rollover [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Read selected-week control metadata
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));const season=Number(b.season||2026),week=Number(b.week),games=Number(b.scheduleCoverage?.slateCount||b.games?.length||0);if(!Number.isFinite(week)||week<0)throw new Error('weekly-board.json has no valid selected week');if(!Number.isFinite(games)||games<=0)throw new Error('weekly-board.json has no valid selected-week game count');console.log(`CFB_SEASON=${season}`);console.log(`CFB_WEEK=${week}`);console.log(`CFB_EXPECTED_GAMES=${games}`);
          NODE

      - name: Losslessly reconcile Expert Intelligence primary ledger
        id: expert_sync
        continue-on-error: true
        run: node scripts/sync-expert-ledger.mjs

      - name: Refresh team and position-group statistical display metrics
        id: stats_refresh
        continue-on-error: true
        run: node scripts/refresh-team-metrics.mjs

      - name: Refresh ESPN FPI and opponent-adjusted efficiency components
        id: fpi_refresh
        continue-on-error: true
        run: node scripts/refresh-espn-fpi.mjs

      - name: Publish selected-week model inputs before browser calculation
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/team-metrics-current.json data/espn-fpi-current.json data/live-team-stats.json; then echo 'No model-input persistence needed.'; exit 0; fi
          git add data/team-metrics-current.json data/espn-fpi-current.json data/live-team-stats.json 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No publishable model-input changes.'; exit 0; fi
          git commit -m 'chore: publish selected-week CFB model inputs [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Install browser runtime
        if: ${{ always() }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture governed portal outputs using current selected-week inputs
        id: capture_runtime
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/capture-governed-runtime.mjs

      - name: Reconcile canonical team identities across schedule, ESPN and Phil Steele
        id: identity
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/audit-team-identities.mjs

      - name: Verify Phil Steele in-season quantitative model and display layer
        id: phil_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-phil-inseason-layer.mjs

      - name: Verify selectable multi-model and market-independent fair construction
        id: multimodel_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-multi-model.mjs

      - name: Build full-slate evidence-backed Deep Dives
        id: deep_dives
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/build-deep-dive-runtime.mjs

      - name: Build isolated unified upset research
        id: upset
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/build-upset-research.mjs

      - name: Refresh Market Movers and specialty screens
        id: specialty
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/build-specialty-layers.mjs

      - name: Refresh free-source moneylines
        id: moneylines
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/refresh-free-moneylines.mjs

      - name: Apply governed free-source moneylines
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/apply-free-moneylines.mjs

      - name: Apply Longshot v2 25-point scores and narratives
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/apply-longshot-v2.mjs

      - name: Freeze due immutable pre-kickoff snapshots
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_SNAPSHOT_LOOKAHEAD_MINUTES: '90'
        run: node scripts/freeze-pre-kickoff-snapshots.mjs

      - name: Audit immutable pre-kickoff snapshot integrity
        id: snapshot_verify
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/verify-final-snapshot-integrity.mjs

      - name: Verify statistical/FPI Matchup Center display at desktop and mobile
        id: stats_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-statistical-display.mjs

      - name: Verify independent market-derived arithmetic and selected-model render
        id: market_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-market-derived-integrity.mjs

      - name: Refresh weekly control manifest
        id: manifest
        if: ${{ always() }}
        continue-on-error: true
        run: node scripts/refresh-weekly-manifest.mjs

      - name: Persist governed decision runtime safely
        if: ${{ always() }}
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          if git diff --quiet -- data/; then echo 'No governed data changes.'; exit 0; fi
          git add data/
          git commit -m 'chore: persist governed CFB decision runtime [skip ci]'
          git fetch origin main
          git rebase origin/main || { git rebase --abort || true; echo 'Could not safely reconcile generated runtime with latest main.'; exit 1; }
          git push origin HEAD:main

      - name: Verify live production decision system
        id: live_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
          CFB_MIN_MEANINGFUL_MODELS: '40'
          CFB_MIN_MARKET_GAMES: '60'
        run: node scripts/verify-live-portal.mjs

      - name: Verify every live portal tab and specialty field
        id: completeness_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-portal-completeness.mjs

      - name: Verify Best Bets render stability and model-independent specialty layers
        id: stability_verify
        if: ${{ always() }}
        continue-on-error: true
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-model-specialty-stability.mjs

      - name: Certify clean live-browser verification
        if: ${{ always() && steps.phil_verify.outcome == 'success' && steps.multimodel_verify.outcome == 'success' && steps.stats_verify.outcome == 'success' && steps.market_verify.outcome == 'success' && steps.live_verify.outcome == 'success' && steps.completeness_verify.outcome == 'success' && steps.stability_verify.outcome == 'success' }}
        run: |
          node - <<'NODE'
          const fs=require('fs');const p=`data/weekly-manifest-${process.env.CFB_SEASON}-w${process.env.CFB_WEEK}.json`;const m=JSON.parse(fs.readFileSync(p,'utf8'));m.gates.productionVerifier={status:'PASS',priorFailure:false,verifiedAt:new Date().toISOString(),detail:'Explicit selected-week live decision-system, identity, Phil, FPI/statistical, multi-model independence, market-derived, every-tab and mobile/stability verification passed.'};const hardFail=Object.values(m.gates||{}).some(g=>g?.status==='FAIL');m.status=hardFail?'FAIL':'PASS-WITH-IN-PROGRESS-GATES';m.updatedAt=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          git config user.name 'cfb-runtime-bot'; git config user.email 'cfb-runtime-bot@users.noreply.github.com'; git add data/weekly-manifest-${CFB_SEASON}-w${CFB_WEEK}.json
          if ! git diff --cached --quiet; then git commit -m 'chore: certify clean CFB live verification [skip ci]'; git fetch origin main; git rebase origin/main; git push origin HEAD:main; fi

      - name: Enforce weekly non-negotiable gates
        if: ${{ always() }}
        run: node scripts/verify-weekly-gates.mjs
