name: Capture governed CFB runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-governed-runtime.mjs'
      - 'scripts/build-deep-dive-runtime.mjs'
      - 'scripts/build-specialty-layers.mjs'
      - 'scripts/build-upset-research.mjs'
      - 'scripts/refresh-free-moneylines.mjs'
      - 'scripts/apply-free-moneylines.mjs'
      - 'scripts/apply-longshot-v2.mjs'
      - 'scripts/sync-expert-ledger.mjs'
      - 'scripts/refresh-weekly-manifest.mjs'
      - 'scripts/verify-live-portal.mjs'
      - 'scripts/verify-portal-completeness.mjs'
      - 'scripts/verify-weekly-gates.mjs'
      - '.github/workflows/capture-governed-runtime.yml'
      - 'data/weekly-board.json'
      - 'data/deep-dive-status.json'
      - 'data/deep-dives-*.json'
      - 'data/upset-research-*.json'
      - 'data/weekly-manifest-*.json'
      - 'data/underdog-special.json'
      - 'data/longshot-upset-lab.json'
      - 'data/free-moneylines-*.json'
      - 'data/market-model-history.json'
      - 'data/timing-observations/**'
      - 'data/expert-weekly.json'
      - 'data/expert-ledger-reconciliation.json'
      - 'data/expert-episode-audit/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-governed-runtime-capture
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read selected-week control metadata
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('data/weekly-board.json','utf8'));
          const season=Number(b.season||2026);
          const week=Number(b.week);
          const games=Number(b.scheduleCoverage?.slateCount||b.games?.length||0);
          if(!Number.isFinite(week)||week<0) throw new Error('weekly-board.json has no valid selected week');
          if(!Number.isFinite(games)||games<=0) throw new Error('weekly-board.json has no valid selected-week game count');
          console.log(`CFB_SEASON=${season}`);
          console.log(`CFB_WEEK=${week}`);
          console.log(`CFB_EXPECTED_GAMES=${games}`);
          NODE
      - name: Losslessly reconcile Expert Intelligence primary ledger
        run: node scripts/sync-expert-ledger.mjs
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture governed portal outputs
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/capture-governed-runtime.mjs
      - name: Build full-slate evidence-backed Deep Dives
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/build-deep-dive-runtime.mjs
      - name: Build isolated unified upset research
        run: node scripts/build-upset-research.mjs
      - name: Refresh Market Movers and specialty screens
        run: node scripts/build-specialty-layers.mjs
      - name: Refresh free-source moneylines
        run: node scripts/refresh-free-moneylines.mjs
      - name: Apply governed free-source moneylines
        run: node scripts/apply-free-moneylines.mjs
      - name: Apply Longshot v2 25-point scores and narratives
        run: node scripts/apply-longshot-v2.mjs
      - name: Refresh weekly control manifest
        run: node scripts/refresh-weekly-manifest.mjs
      - name: Persist governed decision runtime safely
        run: |
          set -e
          git config user.name 'cfb-runtime-bot'
          git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer runtime commit already landed while this run was executing; treating this capture as superseded rather than rebasing generated JSON.'
            git reset --hard origin/main
            exit 0
          fi
          if git diff --quiet -- data/; then
            echo 'No governed data changes.'
            exit 0
          fi
          git add data/
          git commit -m 'chore: persist governed CFB decision runtime [skip ci]'
          if ! git push origin HEAD:main; then
            echo 'Remote advanced during push; a newer runtime owns persistence. Resetting to latest main and exiting successfully.'
            git fetch origin main
            git reset --hard origin/main
            exit 0
          fi
      - name: Verify live production decision system
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
          CFB_MIN_MEANINGFUL_MODELS: '40'
          CFB_MIN_MARKET_GAMES: '60'
        run: node scripts/verify-live-portal.mjs
      - name: Verify every live portal tab and specialty field
        env:
          CFB_PORTAL_URL: https://cfb-betting-intelligence.netlify.app/
        run: node scripts/verify-portal-completeness.mjs
      - name: Certify clean live-browser verification
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=`data/weekly-manifest-${process.env.CFB_SEASON}-w${process.env.CFB_WEEK}.json`;
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const v=m.gates?.productionVerifier||{};
          m.gates.productionVerifier={status:'PASS',priorFailure:false,verifiedAt:new Date().toISOString(),detail:'Explicit live decision-system verification and every-tab portal completeness verification both passed with zero browser/page/runtime errors.'};
          const hardFail=Object.values(m.gates||{}).some(g=>g?.status==='FAIL');
          m.status=hardFail?'FAIL':'PASS-WITH-IN-PROGRESS-GATES';
          m.updatedAt=new Date().toISOString();
          m.currentPriorityQueue=hardFail?Object.entries(m.gates).filter(([,g])=>g?.status==='FAIL').map(([k,g])=>`${k}: ${g.detail||''}`):['Maintain injury/market/expert refreshes through kickoff','Freeze each final pre-kickoff snapshot'];
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          git config user.name 'cfb-runtime-bot'
          git config user.email 'cfb-runtime-bot@users.noreply.github.com'
          git add data/weekly-manifest-${CFB_SEASON}-w${CFB_WEEK}.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: certify clean CFB live verification [skip ci]'
            git push origin HEAD:main
          fi
      - name: Enforce weekly non-negotiable gates
        run: node scripts/verify-weekly-gates.mjs
